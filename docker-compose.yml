version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: transaction-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: transaction_db
      MYSQL_USER: txuser
      MYSQL_PASSWORD: txpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../transaction-processor/database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../transaction-processor/database/02_stored_procedures-1.sql:/docker-entrypoint-initdb.d/02_stored_procedures.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "txuser", "-ptxpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - transaction-net

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: transaction-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --default-log-level=warn
    ports:
      - "19092:19092"
      - "18082:18082"
      - "18081:18081"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy.+true' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - transaction-net

  redpanda-init:
    image: redpandadata/redpanda:latest
    container_name: transaction-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        rpk topic create transaction-events \
          --brokers redpanda:9092 \
          --partitions 3 \
          --replicas 1 || true
        rpk topic create transaction-events-dlq \
          --brokers redpanda:9092 \
          --partitions 1 \
          --replicas 1 || true
        echo "Kafka topics created."
    networks:
      - transaction-net

  transaction-processor:
    build:
      context: ../transaction-processor
      dockerfile: Dockerfile
    container_name: transaction-processor
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Database=Server=mysql;Port=3306;Database=transaction_db;User=txuser;Password=txpassword;Pooling=true;MinimumPoolSize=1;MaximumPoolSize=30;ConnectionTimeout=15;
      - Kafka__BootstrapServers=redpanda:9092
      - MockData__IntervalSeconds=5
      - MockData__BatchSize=5
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - transaction-net

  transaction-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transaction-aggregation-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Database=Server=mysql;Port=3306;Database=transaction_db;User=txuser;Password=txpassword;Pooling=true;MinimumPoolSize=1;MaximumPoolSize=30;ConnectionTimeout=15;
      - Jwt__Key=TransactionAggregationApi-SuperSecretKey-2024-DoNotUseInProduction
      - Jwt__Issuer=transaction-aggregation-api
      - Jwt__Audience=transaction-aggregation-clients
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      transaction-processor:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - transaction-net

volumes:
  mysql_data:

networks:
  transaction-net:
    driver: bridge
